name: Build standalone Android test
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK and native tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify native library
        run: |
          set -euo pipefail
          mkdir -p artifacts
          unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libinternaltest.so > artifacts/libinternaltest.so
          test -s artifacts/libinternaltest.so
          readelf -h artifacts/libinternaltest.so
          readelf -h artifacts/libinternaltest.so | grep AArch64
      - uses: actions/upload-artifact@v4
        with:
          name: InternalTest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: InternalTest-ARM64
          path: artifacts/libinternaltest.so
          if-no-files-found: error
