name: Build JNI ARM64 library
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Configure native ARM64 release
        shell: bash
        run: |
          set -euo pipefail
          cmake -S app/src/main/cpp -B build/native-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile JNI shared library
        run: cmake --build build/native-arm64 --target internaltest --parallel
      - name: Verify and stage library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          LIB=build/native-arm64/libinternaltest.so
          test -s "$LIB"
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$LIB" -o artifacts/libinternaltest.so
          readelf -h artifacts/libinternaltest.so > elf-header.txt
          grep -E 'Type:.*DYN' elf-header.txt
          grep -E 'Machine:.*AArch64' elf-header.txt
          readelf --dyn-syms --wide artifacts/libinternaltest.so > elf-symbols.txt
          for method in init resize frame touch; do
            grep -q "Java_com_internaltest_demo_MainActivity_$method$" elf-symbols.txt
          done
          readelf -d artifacts/libinternaltest.so > elf-dynamic.txt
          if grep -q 'libc++_shared.so' elf-dynamic.txt; then
            echo "Unexpected shared C++ runtime dependency"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: InternalTest-ARM64
          path: artifacts/libinternaltest.so
          if-no-files-found: error
          retention-days: 14
